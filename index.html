<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>درخواست خدمات | دید گستر ملل</title>

rel="stylesheet">

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

background:
linear-gradient(180deg,#f8f5fa,#f3f5f9);

font-family:
"Vazirmatn",
Tahoma,
Arial,
sans-serif;

color:#29233a;

}

.container{

width:
min(1100px,calc(100% - 24px));

margin:auto;

padding:18px 0 40px;

}


/* HEADER */

.header{

background:
linear-gradient(
135deg,
#57165f,
#742b7d
);

border-radius:28px;

padding:25px;

color:white;

box-shadow:
0 15px 40px rgba(83,25,91,.20);

position:relative;

overflow:hidden;

}

.header:before{

content:"";

position:absolute;

width:260px;
height:260px;

background:
rgba(255,255,255,.08);

border-radius:50%;

left:-90px;
top:-100px;

}

.header-content{

position:relative;

display:flex;

align-items:center;

gap:20px;

}

.logo{

width:95px;
height:95px;

border-radius:22px;

object-fit:cover;

background:white;

padding:5px;

box-shadow:
0 8px 20px rgba(0,0,0,.15);

}

.header h1{

margin:0 0 7px;

font-size:25px;

font-weight:800;

}

.header p{

margin:0;

font-size:13px;

opacity:.9;

line-height:2;

}


/* TITLE */

.page-title{

text-align:center;

margin:30px 0 8px;

font-size:25px;

font-weight:800;

color:#4d1856;

}

.page-subtitle{

text-align:center;

color:#777;

font-size:13px;

margin-bottom:22px;

}


/* SERVICES */

.services{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:15px;

}

.service{

position:relative;

background:white;

border:1px solid #e7e1e9;

border-radius:21px;

padding:18px 14px;

cursor:pointer;

transition:
all .22s ease;

box-shadow:
0 8px 25px rgba(60,30,70,.07);

min-height:175px;

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

text-align:center;

}

.service:hover{

transform:
translateY(-5px);

box-shadow:
0 15px 32px rgba(75,30,85,.15);

}

.service input{

display:none;

}

.icon{

width:66px;
height:66px;

border-radius:19px;

display:flex;

align-items:center;

justify-content:center;

background:
linear-gradient(
135deg,
#f3e7f5,
#ead5ed
);

color:#64206b;

margin-bottom:12px;

transition:.22s;

}

.icon svg{

width:32px;
height:32px;

stroke:currentColor;

fill:none;

stroke-width:1.8;

stroke-linecap:round;

stroke-linejoin:round;

}

.service-title{

font-size:14px;

font-weight:800;

color:#39263d;

margin-bottom:5px;

}

.service-description{

font-size:10.5px;

color:#888;

line-height:1.8;

}


/* SELECTED */

.service:has(input:checked){

border:
2px solid #682170;

background:
linear-gradient(
135deg,
#fff,
#f8eef9
);

transform:
translateY(-5px);

box-shadow:
0 15px 35px rgba(101,32,107,.20);

}

.service:has(input:checked)
.icon{

background:
linear-gradient(
135deg,
#5e1d65,
#923a9d
);

color:white;

transform:
scale(1.05);

}

.service:has(input:checked)
.service-title{

color:#64206b;

}

.selected{

display:none;

position:absolute;

top:10px;

left:10px;

width:25px;

height:25px;

border-radius:50%;

background:#25a55b;

color:white;

align-items:center;

justify-content:center;

font-weight:bold;

}

.service:has(input:checked)
.selected{

display:flex;

}


/* FORM */

.form-section{

margin-top:22px;

background:white;

border-radius:24px;

padding:25px;

box-shadow:
0 10px 30px rgba(50,30,70,.08);

border:1px solid #eee7ef;

}

.form-title{

font-size:20px;

font-weight:800;

color:#4e1856;

margin-bottom:18px;

}

.form-grid{

display:grid;

grid-template-columns:
1fr 1fr;

gap:12px;

}

.field{

display:flex;

flex-direction:column;

gap:6px;

}

.field label{

font-size:11px;

color:#666;

font-weight:600;

}

.field input,
.field select,
.field textarea{

font-family:inherit;

border:
1px solid #ddd7e2;

border-radius:13px;

padding:12px;

font-size:12px;

outline:none;

transition:.2s;

background:#fff;

}

.field input:focus,
.field select:focus,
.field textarea:focus{

border-color:#702878;

box-shadow:
0 0 0 3px rgba(112,40,120,.08);

}

.field textarea{

min-height:90px;

resize:vertical;

}

.full{

grid-column:
1 / -1;

}


/* BUTTON */

.submit{

width:100%;

border:0;

border-radius:14px;

padding:14px;

margin-top:15px;

font-family:inherit;

font-size:14px;

font-weight:800;

color:white;

cursor:pointer;

background:
linear-gradient(
90deg,
#581660,
#86358f
);

box-shadow:
0 10px 25px rgba(93,29,103,.25);

transition:.2s;

}

.submit:hover{

transform:
translateY(-2px);

box-shadow:
0 14px 30px rgba(93,29,103,.30);

}


/* LINKS */

.links{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:10px;

margin-top:12px;

}

.links a{

text-decoration:none;

text-align:center;

padding:11px;

border-radius:12px;

color:white;

font-size:12px;

font-weight:700;

}

.whatsapp{

background:#19a85a;

}

.eitaa{

background:#ed861c;

}

.channel{

background:#258ec9;

}


/* STATUS */

.status{

display:none;

margin-top:12px;

padding:12px;

border-radius:12px;

font-size:12px;

text-align:center;

background:#edf8f0;

color:#20753d;

}


/* FOOTER */

.footer{

margin-top:25px;

background:
linear-gradient(
135deg,
#4f1757,
#74297d
);

border-radius:20px;

padding:18px;

color:white;

text-align:center;

font-size:12px;

line-height:2;

}

.footer strong{

font-size:14px;

}


/* MOBILE */

@media(max-width:900px){

.services{

grid-template-columns:
repeat(2,1fr);

}

}

@media(max-width:600px){

.container{

width:
calc(100% - 14px);

}

.header{

padding:20px;

}

.header-content{

gap:13px;

}

.logo{

width:75px;
height:75px;

border-radius:18px;

}

.header h1{

font-size:20px;

}

.header p{

font-size:11px;

}

.page-title{

font-size:21px;

}

.services{

grid-template-columns:
repeat(2,1fr);

gap:9px;

}

min-height:160px;

padding:12px 7px;

}

.icon{

width:54px;
height:54px;

border-radius:16px;

.icon svg{

width:27px;
height:27px;

}

.service-title{

font-size:11.5px;

}

.service-description{

font-size:9px;

}

.form-grid{

grid-template-columns:1fr;

}

.full{

grid-column:auto;

}

.links{

grid-template-columns:1fr;

}

}

</style>

</head>

<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbxp47PYOMqLtRD0B7V5LA9xm9Uoc3_1yhQjs6EopFkIEs9lqLs2ipiCkZ8ptUjcX1Ro/exec";


function getServices(){

return [

...document
.querySelectorAll(
'input[name="services"]:checked'
)

].map(
x => x.value
);

}


async function submitForm(){


const services =
getServices();


const name =
document
.getElementById("name")
.value
.trim();


const phone =
document
.getElementById("phone")
.value
.trim();


const company =
document
.getElementById("company")
.value
.trim();


const type =
document
.getElementById("type")
.value;


const note =
document
.getElementById("note")
.value
.trim();


if(services.length === 0){

alert(
"لطفاً حداقل یک خدمت را انتخاب کنید."
);

return;

}


if(!name){

alert(
"لطفاً نام خود را وارد کنید."
);

return;

}


if(!phone){

alert(
"لطفاً شماره تماس خود را وارد کنید."
);

return;

}


if(!type){

alert(
"لطفاً نوع مجموعه را انتخاب کنید."
);

return;

}


const status =
document
.getElementById("status");


status.style.display =
"block";

status.innerText =
"در حال ثبت درخواست...";


const data = {

name:name,

phone:phone,

company:company,

type:type,

note:note,

services:services.join("، "),

source:
"melalneeds.github.io"

};


try{


await fetch(
API_URL,
{

method:"POST",

mode:"no-cors",

headers:{
"Content-Type":
"text/plain;charset=utf-8"
},

body:
JSON.stringify(data)

});


status.innerText =
"✅ درخواست شما ثبت شد. کارشناسان ما به‌زودی با شما تماس می‌گیرند.";


const message =

"سلام، از طریق فرم سایت دید گستر ملل درخواست دارم.%0A%0A"

+

"نام: "
+ encodeURIComponent(name)

+

"%0Aشماره تماس: "
+ encodeURIComponent(phone)

+

"%0Aمجموعه: "
+ encodeURIComponent(company)

+

"%0Aنوع مجموعه: "
+ encodeURIComponent(type)

+

"%0Aخدمات: "
+ encodeURIComponent(
services.join("، ")
)

+

"%0Aتوضیحات: "
+ encodeURIComponent(note);


setTimeout(()=>{

window.open(
"https://wa.me/989134286813?text="
+
message,
"_blank"
);

},700);


}

catch(error){

status.innerText =
"در ارسال درخواست مشکلی پیش آمد. لطفاً از طریق واتساپ با ما تماس بگیرید.";

}


}


</script>
